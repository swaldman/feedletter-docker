# feedletter, in three containers:
#
#   db         - PostgreSQL, the system of record
#   feedletter - the service (daemon + web API), built from this directory
#   caddy      - TLS-terminating reverse proxy with automatic Let's Encrypt certs
#
# Copy .env.sample to .env and edit it before running. First-run bootstrap
# steps (db-init, set-config) are in README.md.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: feedletter
      POSTGRES_DB: feedletter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      # Daemon waits for this before connecting; avoids a startup race.
      test: ["CMD-SHELL", "pg_isready -U feedletter -d feedletter"]
      interval: 5s
      timeout: 5s
      retries: 12

  feedletter:
    build: .
    # unless-stopped: comes back on host reboot (like db/caddy) AND keeps
    # retrying if it exits -- which also rides out the startup race against
    # Postgres after a reboot (see note below; depends_on ordering does NOT
    # apply to daemon-driven restarts, only to `docker compose up`).
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Secrets file mounted read-only. It MUST be chmod 600 on the host
      # (feedletter rejects looser permissions). See README.md.
      - ./secrets/feedletter-secrets.properties:/etc/feedletter/feedletter-secrets.properties:ro
    # By default feedletter is NOT published to the host -- only the caddy
    # service reaches it over the internal network. If you terminate TLS with
    # your own reverse proxy instead (and comment out the caddy service below),
    # uncomment this to expose feedletter on the host loopback for that proxy.
    # Choose the host-side port via FEEDLETTER_HTTP_PORT in .env (the container
    # side stays 8024, feedletter's web-daemon-port); point your proxy at it.
    # ports:
    #   - "127.0.0.1:${FEEDLETTER_HTTP_PORT:-8024}:8024"
    # Override per-invocation for admin commands:
    #   docker compose run --rm feedletter db-init
    #   docker compose run --rm feedletter add-feed https://example.com/feed.xml
    command: ["daemon"]

  # Caddy terminates TLS (automatic Let's Encrypt certs) and reverse-proxies to
  # feedletter. This is the default deployment. If you instead terminate TLS with
  # your OWN reverse proxy (nginx, a cloud load balancer, etc.), comment out this
  # entire `caddy:` service and uncomment the `ports:` block under `feedletter`
  # above. See "Running behind your own TLS / reverse proxy" in README.md.
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - feedletter
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Used by Caddyfile. Set to your public hostname in .env.
      FEEDLETTER_DOMAIN: ${FEEDLETTER_DOMAIN:?set FEEDLETTER_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # issued certs + ACME account key live here -- keep it!
      - caddy_config:/config

volumes:
  pg_data:
  caddy_data:
  caddy_config:
