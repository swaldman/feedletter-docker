# Local-testing overlay: run feedletter directly, no Caddy, no domain, no TLS.
#
# Usage (note: BOTH -f flags, and NO --profile proxy, so caddy stays down):
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up
#
# Then reach the web API at http://localhost:8024/ . One-off admin commands
# take the same -f flags, e.g.:
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml \
#     run --rm feedletter db-init
#
# Remember to point feedletter at this URL (and bind all interfaces so the
# published port reaches the process inside the container):
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml \
#     run --rm feedletter set-config --web-daemon-interface 0.0.0.0
#   docker compose -f docker-compose.yml -f docker-compose.local.yml \
#     run --rm feedletter set-config --web-api-protocol http --web-api-host-name localhost

services:
  feedletter:
    # Publish the web daemon to the host loopback only -- reachable from this
    # machine's browser, not exposed to the network. (In the prod stack this
    # port is unpublished; only Caddy fronts it.)
    ports:
      - "127.0.0.1:8024:8024"
